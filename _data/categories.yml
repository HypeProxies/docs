# Services shown in the sidebar, on the home page and in the footer, in this order.
#
#   id:          folder name of the service (lowercase-with-hyphens)
#   title:       name shown to customers
#   description: one sentence, shown on the home page and the service page
#   icon:        mac | server | cloud | globe | doc  (see _includes/icon.html)
#
# Guides are picked up automatically from the folder. A service with no guides
# yet is shown as "Coming soon".

- id: mac-mini
  title: Mac mini (dedicated)
  description: A physical Apple silicon Mac mini in our datacenter, used only by you, with remote access over SSH, Screen Sharing and a browser KVM console.
  icon: mac

- id: bare-metal
  title: Bare metal servers
  description: Dedicated physical servers, used only by you.
  icon: server

- id: vps
  title: VPS
  description: Virtual private servers.
  icon: cloud

- id: proxy
  title: Proxy servers
  description: Dedicated ISP and residential proxies.
  icon: globe
