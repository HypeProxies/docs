<section class="help-card" aria-labelledby="help-card-title">
  <div class="help-card-text">
    <h2 id="help-card-title">{{ include.title | default: "Still need help?" }}</h2>
    <p>Open a ticket from the client area and our team will take a look.</p>
  </div>
  <div class="help-card-actions">
    <a class="btn btn-light" href="{{ site.links.ticket }}">Open a ticket {% include icon.html name="arrow-right" %}</a>
    <a class="btn btn-outline-light" href="{{ site.links.discord }}">Join Discord</a>
  </div>
</section>
