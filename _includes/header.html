<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <img class="brand-mark" src="{{ '/assets/img/logo-mark.png' | relative_url }}" width="30" height="30" alt="">
      <span class="brand-wordmark">{% include wordmark.svg %}</span>
      <span class="brand-docs">Docs</span>
    </a>
    <nav class="header-nav" aria-label="HypeProxies">
      <a href="{{ site.links.website }}">Website</a>
      <a href="{{ site.links.help_center }}">Help Center</a>
    </nav>
    <div class="header-actions">
      <a class="btn btn-secondary header-ticket" href="{{ site.links.ticket }}">Open a ticket</a>
      <a class="btn btn-primary" href="{{ site.links.login }}">Login</a>
    </div>
  </div>
</header>
